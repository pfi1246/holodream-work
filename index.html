<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HoloDream 自製組隊工具（修復版）</title>
<style>
:root{color-scheme:dark;--bg:#1e1e24;--panel:#2a2a35;--main:#25252f;--blue:#00a2ff;--green:#2ed573;--orange:#ffa500}
*{box-sizing:border-box}
body{font-family:"PingFang TC","Microsoft JhengHei",sans-serif;margin:0;padding:16px;background:var(--bg);color:#fff;min-height:100vh;display:flex;gap:16px}
#sidebar{width:300px;flex:0 0 300px;background:var(--panel);padding:16px;border-radius:12px;box-shadow:0 4px 15px #0004;display:flex;flex-direction:column;gap:12px;max-height:none;overflow:visible;align-self:flex-start}
/* 左側篩選面板隨一般頁面自然捲動，不固定也不獨立捲動 */
#main-panel{flex:1;min-width:0;background:var(--main);padding:20px;border-radius:12px;box-shadow:0 4px 15px #0004;display:flex;flex-direction:column;min-height:calc(100vh - 32px)}
h2,h3{margin:0;padding-bottom:5px;color:var(--blue)}h2{font-size:20px}h3{border-bottom:1px solid #444;font-size:14px;margin-top:5px}
.filter-group{display:flex;flex-direction:column;gap:6px}.btn-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.filter-btn{background:#3a3a4c;color:#fff;border:1px solid #555;padding:8px 6px;border-radius:6px;cursor:pointer;text-align:center;font-size:12px;transition:.15s}
.filter-btn:hover{background:#4a4a60}.filter-btn.active{background:var(--blue);border-color:var(--blue);font-weight:bold}
.reset-btn{background:#ff4d4d;color:white;border:0;padding:10px;border-radius:6px;cursor:pointer;font-weight:bold}.reset-btn:hover{background:#ff3333}
#hint-text{color:#ccc;font-size:12px;background:#1a1a22;padding:9px;border-radius:6px;border-left:4px solid #ff4d4d;line-height:1.5}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px;color:#aaa;font-size:12px}.toolbar input{background:#191920;border:1px solid #555;color:white;padding:8px;border-radius:6px;min-width:190px}
.grid-container{flex:1;overflow:visible;margin-top:15px;padding:2px 5px 8px 2px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:#323242;border:2px solid #444;border-radius:10px;padding:12px;text-align:center;cursor:pointer;transition:all .18s ease;position:relative;min-width:0}
.card:hover{transform:translateY(-2px);border-color:#777}.card .name{font-size:16px;font-weight:bold;margin-bottom:7px;overflow-wrap:anywhere}
.card .tag-container{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-bottom:8px}.tag{font-size:10px;background:#ffffff1a;padding:3px 5px;border-radius:4px}
.skill-info{font-size:12px;color:#ddd;background:#0003;padding:7px;border-radius:5px;text-align:left;line-height:1.5;min-height:36px}
.card.match-filter{border-color:var(--blue);background:#1a2f4c}.card.synergy-partner{border-color:var(--green);background:#143525;box-shadow:0 0 8px #2ed57355}.card.selected-core{border-color:var(--orange);background:#4c3a1a;box-shadow:0 0 10px #ffa50066}.card.dimmed{opacity:.25}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:#bbb;font-size:12px;margin-top:8px}.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
#empty-state{display:none;color:#aaa;padding:30px;text-align:center}
@media(max-width:760px){body{flex-direction:column;padding:10px}#sidebar{width:100%;flex-basis:auto;max-height:none}#main-panel{min-height:60vh;padding:14px}.grid{grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}}
.community-banner{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:#34324a;border:1px solid #66618c;border-radius:12px;padding:14px 16px;margin-bottom:16px}
.community-banner strong{display:block;font-size:16px;margin-bottom:5px}.community-banner p{margin:0;color:#ddd;font-size:13px;line-height:1.6}
.community-link{display:inline-block;background:#5865f2;color:#fff;text-decoration:none;padding:11px 16px;border-radius:9px;font-weight:700;white-space:nowrap}.community-link:hover,.community-link:focus-visible{background:#7289ff}

/* 類型篩選：以原始遊戲屬性圖示取代愛心 emoji，保留原有篩選事件 */
.attr-icon-btn{display:flex;align-items:center;justify-content:flex-start;gap:9px;padding:8px 10px;font-size:14px;font-weight:700;min-height:46px;border-radius:9px}
.attr-icon{display:block;width:29px;height:29px;object-fit:contain;flex-shrink:0}
.attr-icon-btn.active{background:var(--blue)}

.filter-btn[data-type="spec"]{display:flex;align-items:center;justify-content:flex-start;gap:9px;font-weight:700}
.skill-icon-btn{display:flex;align-items:center;justify-content:flex-start;gap:9px;font-size:14px;font-weight:700;min-height:46px;padding:8px 10px}
.skill-filter-icon{width:29px;height:29px;object-fit:contain;flex-shrink:0;display:block}
/* 被動技能五個按鈕統一圖示位置、大小與文字對齊 */
.filter-btn[data-type="skill"]{display:flex;align-items:center;justify-content:flex-start;gap:9px;width:100%;min-height:46px;padding:8px 10px;border-radius:9px;font-size:14px;font-weight:700;text-align:left}
.skill-emoji-icon{width:29px;height:29px;flex:0 0 29px;display:inline-flex;align-items:center;justify-content:center;font-size:21px;line-height:1}
.filter-btn[data-type="skill"] span:last-child{white-space:normal}
.skill-grid{grid-template-columns:minmax(0,1fr)}

/* 被動技能按鈕：維持單欄，縮成與服裝系列同樣纖細 */
.filter-btn[data-type="skill"]{
  min-height:0;
  height:42px;
  padding:5px 10px;
  border-radius:7px;
  font-size:12px;
  gap:8px;
  line-height:1.2;
}
.filter-btn[data-type="skill"] .skill-filter-icon{
  width:24px;height:24px;
}
.filter-btn[data-type="skill"] .skill-emoji-icon{
  width:24px;height:24px;flex-basis:24px;font-size:18px;
}
.filter-btn[data-type="skill"] span:last-child{
  white-space:nowrap;
  font-size:12px;
}

/* 類型與專長：與服裝系列相同的纖細高度，維持雙欄 */
.filter-btn[data-type="attr"],
.filter-btn[data-type="spec"]{
  min-height:0;
  height:42px;
  padding:5px 10px;
  border-radius:7px;
  font-size:12px;
  line-height:1.2;
  gap:8px;
}
.filter-btn[data-type="attr"] .attr-icon,
.filter-btn[data-type="spec"] .skill-filter-icon{
  width:24px;
  height:24px;
}

.mode-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;cursor:pointer;padding:8px 10px;background:#3a3a4c;border-radius:7px}
.mode-toggle input{position:absolute;opacity:0;width:1px;height:1px}
.toggle-track{width:39px;height:22px;flex-shrink:0;border-radius:14px;background:#666;position:relative;transition:background .2s}
.toggle-track:before{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;background:white;border-radius:50%;transition:transform .2s}
.mode-toggle input:checked+.toggle-track{background:#00a2ff}
.mode-toggle input:checked+.toggle-track:before{transform:translateX(17px)}
.mode-toggle input:focus-visible+.toggle-track{outline:2px solid white;outline-offset:2px}
.character-alias{display:inline-block;margin:0 6px;padding:2px 7px;border-radius:5px;background:#fff;color:#111;font-size:12px;font-weight:700;vertical-align:middle;white-space:nowrap;border:1px solid #e2e2e2}
.outfit-label{display:inline-block;font-size:14px;white-space:nowrap}
</style>
</head>
<body>
<aside id="sidebar">
<h2>組隊篩選面板</h2>
<div id="hint-text">💡 點擊任一角色卡片，查看依照其被動技能條件可共鳴的隊友。再次點擊同一張卡片即可取消選取。</div>
<button class="reset-btn" id="resetBtn">清除所有條件 / 取消選取</button>

const cardDatabase = rawData.split(/\r?\n/).filter(Boolean).map((line,index)=>{
  const [app,gen,name,attr,spec,passive]=line.split("|").map(v=>v.trim());
  let condType="無";
  const match=passive.match(/^(.+?)\s*\*\s*2\s*➔/);
  if(match) condType=match[1].trim();
  let skill="其他";
  if(passive.includes("無提供技能資料")) skill="無";
  else if(passive.includes("+分數")) skill="分數支援";
  else if(passive.includes("+表現力")) skill="表現力UP";
  else if(passive.includes("+技巧")) skill="技巧UP";
  else if(passive.includes("+品味")) skill="品味UP";
  else if(passive.includes("全能力")) skill="能力UP";
  return {id:index,app,gen,name,attr,spec,passive,condType,skill};
});
const characterAliases = {"Ayunda Risu": "松鼠", "Moona Hoshinova": "月亮", "Airani Iofifteen": "畫家", "Kureiji Ollie": "殭屍", "Anya Melfissa": "短劍", "Pavolia Reine": "孔雀", "Kaela Kovalskia": "工匠", "Mori Calliope": "死神", "Takanashi Kiara": "火雞", "Ninomae Ina'nis": "章魚", "Ouro Kronii": "時間", "Hakos Baelz": "老鼠", "Koseki Bijou": "石頭", "Nerissa Ravencroft": "渡鴉", "Fuwawa Abyssgard": "藍狗", "Mococo Abyssgard": "粉狗"};
const filters={gen:null,attr:null,spec:null,skill:null,app:null};
let activeCoreCard=null;
const grid=document.getElementById("cardGrid");
const title=document.getElementById("panel-title");
const count=document.getElementById("count");
const empty=document.getElementById("empty-state");
const searchBox=document.getElementById("searchBox");
const hideUnmatched=document.getElementById("hideUnmatched");
function makeCard(card){
  const el=document.createElement("article");
  el.className="card";el.dataset.id=card.id;el.tabIndex=0;el.setAttribute("role","button");
  const name=document.createElement("div");name.className="name";
  const mainName=document.createElement("span");mainName.textContent=card.name;name.appendChild(mainName);
  if(characterAliases[card.name]){
    const alias=document.createElement("span");alias.className="character-alias";alias.textContent=characterAliases[card.name];name.appendChild(alias);
  }
  const outfit=document.createElement("span");outfit.className="outfit-label";outfit.textContent=`（${card.app==="泳裝"?"👙 泳裝":card.app==="萬聖節"?"🎃 萬聖節":"📊 普通"}）`;name.appendChild(outfit);
  const tags=document.createElement("div");tags.className="tag-container";
  [[card.gen,"rgba(0,162,255,.15)"],[card.attr,"rgba(255,77,77,.15)"],[card.spec,"rgba(46,213,115,.15)"]].forEach(([txt,bg])=>{const t=document.createElement("span");t.className="tag";t.style.background=bg;t.textContent=txt;tags.appendChild(t);});
  const skill=document.createElement("div");skill.className="skill-info";skill.textContent="🧬 "+card.passive;
  el.append(name,tags,skill);
  const select=()=>{if(activeCoreCard&&activeCoreCard.id===card.id)activeCoreCard=null;else activeCoreCard=card;render();};
  el.addEventListener("click",select);el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select();}});
  return el;
}
const cardElements=new Map();
cardDatabase.forEach(card=>{const el=makeCard(card);cardElements.set(card.id,el);grid.appendChild(el);});
function render(){
  const query=searchBox.value.trim().toLocaleLowerCase();
  const hasFilter=Object.values(filters).some(Boolean)||query.length>0;
  let visible=0;
  cardDatabase.forEach(card=>{
    const el=cardElements.get(card.id);
    const searchText=[card.name,card.app==="普通"?(characterAliases[card.name]||""):"",card.gen,card.attr,card.spec,card.passive,card.app].join(" ").toLocaleLowerCase();
    const searchMatch=!query||searchText.includes(query);
    const filterMatch=(!filters.gen||card.gen===filters.gen)&&(!filters.attr||card.attr===filters.attr)&&(!filters.spec||card.spec===filters.spec)&&(!filters.skill||card.skill===filters.skill)&&(!filters.app||card.app===filters.app)&&searchMatch;
    el.classList.remove("match-filter","synergy-partner","selected-core","dimmed");
    // 依顯示模式切換淡化或隱藏。
    let matched;
    if(activeCoreCard){
      const isSelf=card.id===activeCoreCard.id;
      const isPartner=isSynergy(activeCoreCard,card);
      matched=searchMatch&&(isSelf||isPartner);
      if(matched&&isSelf)el.classList.add("selected-core");
      else if(matched&&isPartner)el.classList.add("synergy-partner");
    }else{
      matched=filterMatch;
      if(hasFilter&&matched)el.classList.add("match-filter");
    }
    el.style.display=hideUnmatched.checked&&!matched?"none":"";
    if(!matched&&!hideUnmatched.checked)el.classList.add("dimmed");
    if(matched)visible++;
  });
  if(activeCoreCard)title.innerHTML=`⭐ 正在檢視與【${escapeHtml(activeCoreCard.name)}（${activeCoreCard.app}）】有技能共鳴的夥伴`;
  else if(hasFilter)title.textContent="🔍 已篩選符合條件的成員";
  else title.textContent="HoloDream 成員配對庫";
  count.textContent=`符合 ${visible} / ${cardDatabase.length} 張角色卡（其餘${hideUnmatched.checked?"隱藏":"淡化顯示"}）`;
  empty.style.display=hideUnmatched.checked&&visible===0?"block":"none";
}
function isSynergy(core,other){
  const cond=core.condType;
  if(!cond||cond==="無"||cond==="（無提供技能資料）")return false;
  if(cond==="同期")return core.gen===other.gen;
  if(cond==="1期生")return other.gen==="JP 1期生"||other.name==="白上吹雪";
  return cond===other.attr;
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
document.querySelectorAll(".filter-btn").forEach(btn=>btn.addEventListener("click",()=>{
  const type=btn.dataset.type,value=btn.dataset.value;
  filters[type]=filters[type]===value?null:value;
  document.querySelectorAll(`.filter-btn[data-type="${type}"]`).forEach(b=>b.classList.toggle("active",b.dataset.value===filters[type]));
  activeCoreCard=null;render();
}));
document.getElementById("resetBtn").addEventListener("click",()=>{
  Object.keys(filters).forEach(k=>filters[k]=null);activeCoreCard=null;searchBox.value="";
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));render();
});
searchBox.addEventListener("input",()=>{activeCoreCard=null;render();});
hideUnmatched.addEventListener("change",render);
render();
